<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fred Core</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 20px; 
      background: #000; 
      color: #fff; 
      line-height: 1.6;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { opacity: 0.7; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
    }
    button { 
      background: #fff; 
      color: #000; 
      border: none; 
      padding: 14px 20px; 
      font-size: 16px; 
      font-weight: 600; 
      border-radius: 8px; 
      width: 100%;
      margin-bottom: 20px;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    #log { 
      background: #111; 
      border: 1px solid #333; 
      border-radius: 8px; 
      padding: 12px; 
      font-size: 13px; 
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
    }
    #log p { margin: 4px 0; opacity: 1; }
    .ok { color: #0f0; }
    .err { color: #f44; }
    .info { color: #0af; }
  </style>
</head>
<body>
  <h1>Fred Core v1</h1>
  <p>Dela hit från CapCut, YouTube eller Swish för att testa tunneln.</p>
  
  <input id="urlInput" placeholder="Klistra YouTube-länk här" type="text">
  <button id="testBtn">Skicka till Fred</button>
  
  <div id="log"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        // DINA RIKTIGA VÄRDEN - NYTT PROJEKT 2026-08-15
    const SUPABASE_URL = 'https://cnrzbbcqzuphlnkwvrex.supabase.co'
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNucnpiYmNxenVwaGxua3d2cmV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTQ5MDYsImV4cCI6MjEwMjMzMDkwNn0.LSo-zX9vIRm8cwxp1bbIW6Bl4L1BmpDNhMjjkMhWQi0'
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON)
    
    const logEl = document.getElementById('log')
    const log = (msg, cls = 'info') => {
      const time = new Date().toLocaleTimeString('sv-SE')
      logEl.innerHTML += `<p class="${cls}">${time}: ${msg}</p>`
      logEl.scrollTop = logEl.scrollHeight
    }

    async function saveAtom(source, atom_type, payload) {
      log(`Sparar ${source}/${atom_type}...`, 'info')
      
      const { data, error } = await supabase.from('fred_atoms').insert({
        user_id: 'jonas',
        source: source,
        atom_type: atom_type,
        payload: payload
      }).select().single()

      if (error) {
        log(`Fel: ${error.message}`, 'err')
        console.error(error)
        return null
      } else {
        log(`✅ Sparad i fred_atoms. ID: ${data.id.slice(0,8)}`, 'ok')
        return data
      }
    }

    function parseShare(text) {
      if (!text || !text.trim()) return null
      
      const ytMatch = text.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/)
      if (ytMatch) {
        const url = text.match(/https?:\/\/[^\s]+/)?.[0]
        return { 
          source: 'capcut', 
          atom_type: 'video', 
          payload: { url: url, videoId: ytMatch[1], raw: text } 
        }
      }
      
      const amount = text.match(/(\d+[,.]?\d*)\s?kr/i)?.[1]?.replace(',', '.')
      const phone = text.match(/(07\d[\d\s-]{8,11})/)?.[0]?.replace(/[\s-]/g, '')
      if (amount || phone) {
        return { 
          source: 'swish', 
          atom_type: 'payment', 
          payload: { amount: amount ? parseFloat(amount) : null, phone: phone, raw: text } 
        }
      }

      return { 
        source: 'unknown', 
        atom_type: 'text', 
        payload: { raw: text } 
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      log('Fred Core startad', 'info')
      
      const params = new URLSearchParams(window.location.search)
      const sharedText = `${params.get('title') || ''} ${params.get('text') || ''} ${params.get('url') || ''}`.trim()

      if (sharedText) {
        log(`Mottaget via Share: ${sharedText.slice(0,50)}...`, 'info')
        const parsed = parseShare(sharedText)
        if (parsed) {
          await saveAtom(parsed.source, parsed.atom_type, parsed.payload)
        }
      } else {
        log('Redo. Väntar på share eller test.', 'info')
      }
    })

    document.getElementById('testBtn').onclick = async () => {
      const val = document.getElementById('urlInput').value
      if (!val) { 
        log('Klistra in en länk först', 'err') 
        return 
      }
      log(`Testar: ${val}`, 'info')
      const parsed = parseShare(val)
      if (parsed) {
        await saveAtom(parsed.source, parsed.atom_type, parsed.payload)
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(e => {
        log(`SW fel: ${e.message}`, 'err')
      })
    }
  </script>
</body>
</html>
